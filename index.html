<style>
:root {
  --bg: #050914;
  --card: rgba(17, 29, 52, .82);
  --blue: #3987ff;
  --cyan: #39e4ff;
  --gold: #ffd36a;
  --green: #42e6a4;
  --text: #f4f7ff;
  --muted: #899bb9;
  --border: rgba(116, 165, 255, .16);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  min-height: 100vh;
  padding-bottom: 105px;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(ellipse at 50% -10%, #17458a 0%, transparent 42%),
    radial-gradient(ellipse at 100% 45%, #10234c 0%, transparent 35%),
    #050914;
}

.app {
  max-width: 480px;
  margin: auto;
  padding: 22px 17px;
}

/* HEADER */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 48px;
  height: 48px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  font-size: 26px;
  font-weight: 950;
  color: white;
  background: linear-gradient(145deg, #55cfff, #1760e9 60%, #102e87);
  box-shadow: 0 0 25px #278aff66, inset 0 1px 8px #ffffff70;
}

.brand h1 {
  font-size: 17px;
  font-weight: 950;
  letter-spacing: 1.2px;
}

.brand p {
  color: var(--muted);
  font-size: 10px;
  margin-top: 4px;
}

.online {
  color: var(--green);
  background: #42e6a411;
  border: 1px solid #42e6a444;
  padding: 8px 12px;
  border-radius: 30px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
}

/* BALANCE */

.balance-card {
  position: relative;
  overflow: hidden;
  padding: 24px 22px;
  margin-bottom: 15px;
  border-radius: 25px;
  border: 1px solid #55a7ff45;
  background:
    radial-gradient(circle at 90% 0%, #48caff35, transparent 42%),
    linear-gradient(135deg, #153d7a, #102443 65%, #0b1930);
  box-shadow: 0 15px 40px #0005, inset 0 1px 1px #ffffff18;
}

.balance-card:after {
  content: "✦";
  position: absolute;
  right: 18px;
  top: 5px;
  color: #ffffff12;
  font-size: 105px;
}

.label {
  color: #b9d6ff;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.7px;
  text-transform: uppercase;
}

.balance {
  position: relative;
  z-index: 1;
  font-size: 43px;
  font-weight: 950;
  letter-spacing: -2px;
  margin: 13px 0 7px;
  text-shadow: 0 3px 20px #46baff40;
}

.balance span {
  color: var(--cyan);
  font-size: 15px;
  letter-spacing: 1px;
}

.small-note {
  color: #a9c5e9;
  font-size: 11px;
}

/* STATS */

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 23px;
}

.stat {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 19px;
  padding: 16px;
  box-shadow: 0 8px 24px #0003;
  backdrop-filter: blur(15px);
}

.stat-top {
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
}

.stat-value {
  font-size: 22px;
  font-weight: 900;
  margin-top: 9px;
}

.energy-bar {
  height: 8px;
  background: #253653;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 11px;
}

.energy-fill {
  height: 100%;
  background: linear-gradient(90deg, #287cff, #42e7ff);
  border-radius: 20px;
  box-shadow: 0 0 12px #38caff;
  transition: width .3s;
}

/* TAP AREA */

.tap-section {
  position: relative;
  text-align: center;
  padding: 20px 0 25px;
  overflow: hidden;
}

.tap-section h2 {
  font-size: 23px;
  font-weight: 950;
  letter-spacing: .3px;
  margin-bottom: 7px;
}

.tap-section p {
  color: var(--muted);
  font-size: 12px;
}

.tap-button {
  position: relative;
  width: 218px;
  height: 218px;
  border-radius: 50%;
  margin: 29px auto 22px;
  border: 3px solid #8ceaff;
  background:
    radial-gradient(circle at 32% 23%, #ffffff 0%, #a9eaff 5%, #48baff 23%, #2676ed 55%, #103b9a 100%);
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  box-shadow:
    0 0 0 7px #328aff18,
    0 0 0 15px #328aff0d,
    0 0 45px #278aff85,
    0 18px 45px #0008,
    inset 0 5px 18px #ffffff90,
    inset 0 -12px 25px #071c61;
  transition: transform .12s, filter .12s;
  animation: coinGlow 3s ease-in-out infinite;
}

.tap-button:active {
  transform: scale(.92);
  filter: brightness(1.2);
}

@keyframes coinGlow {
  0%, 100% {
    box-shadow:
      0 0 0 7px #328aff18,
      0 0 0 15px #328aff0d,
      0 0 35px #278aff70,
      0 18px 45px #0008,
      inset 0 5px 18px #ffffff90;
  }
  50% {
    box-shadow:
      0 0 0 9px #328aff22,
      0 0 0 19px #328aff0d,
      0 0 58px #35d9ffb0,
      0 18px 45px #0008,
      inset 0 5px 18px #ffffff90;
  }
}

.tap-icon {
  font-size: 75px;
  line-height: 1.1;
  filter: drop-shadow(0 5px 7px #082b70);
}

.tap-button strong {
  font-size: 17px;
  letter-spacing: 4px;
  margin-top: 8px;
  text-shadow: 0 2px 8px #082b70;
}

.tap-hint {
  color: #8fa9ce;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 2px;
}

/* TITLES AND REWARDS */

.section-title {
  font-size: 17px;
  font-weight: 900;
  margin: 20px 0 13px;
}

.reward-card,
.list-card,
.invite-box {
  background: linear-gradient(145deg, #14233c, #0d192c);
  border: 1px solid var(--border);
  border-radius: 19px;
  box-shadow: 0 8px 24px #0003;
}

.reward-card {
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.reward-left,
.list-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.reward-icon,
.list-icon {
  width: 46px;
  height: 46px;
  flex-shrink: 0;
  border-radius: 15px;
  display: grid;
  place-items: center;
  font-size: 23px;
  background: linear-gradient(145deg, #253d61, #172944);
  border: 1px solid #ffffff12;
}

.reward-card h3,
.list-card h3 {
  font-size: 13px;
  font-weight: 850;
}

.reward-card p,
.list-card p {
  font-size: 10px;
  color: var(--muted);
  margin-top: 5px;
}

.primary-btn {
  background: linear-gradient(110deg, #287aff, #36caff);
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 12px 15px;
  font-weight: 900;
  font-size: 11px;
  letter-spacing: .3px;
  box-shadow: 0 5px 18px #238cff44;
  cursor: pointer;
}

.primary-btn:active {
  transform: scale(.96);
}

.primary-btn:disabled {
  opacity: .4;
  box-shadow: none;
}

/* NAVIGATION */

.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: 480px;
  margin: auto;
  background: rgba(8, 16, 31, .94);
  border-top: 1px solid #3a5d8b55;
  backdrop-filter: blur(22px);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  padding: 12px 5px calc(12px + env(safe-area-inset-bottom));
  z-index: 10;
}

.nav button {
  background: none;
  border: 0;
  color: #778ba9;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  transition: .2s;
}

.nav button.active {
  color: #55caff;
  text-shadow: 0 0 15px #35aaff80;
}

.nav-icon {
  display: block;
  font-size: 22px;
  margin-bottom: 5px;
}

/* OTHER PAGES */

.page {
  display: none;
}

.page.active {
  display: block;
  animation: pageIn .25s ease;
}

@keyframes pageIn {
  from { opacity: 0; transform: translateY(7px); }
  to { opacity: 1; transform: translateY(0); }
}

.list-card {
  padding: 15px;
  margin-bottom: 11px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.amount {
  color: var(--green);
  font-size: 12px;
  font-weight: 900;
  white-space: nowrap;
}

.invite-box {
  padding: 18px;
  margin-top: 15px;
}

.invite-link {
  background: #070f20;
  border: 1px solid #2a4770;
  border-radius: 12px;
  padding: 14px;
  color: #80c7ff;
  font-size: 11px;
  overflow-wrap: anywhere;
  margin: 14px 0;
}

.wallet-card {
  background:
    radial-gradient(circle at 90% 0%, #47d5ff35, transparent 45%),
    linear-gradient(135deg, #19427d, #101e36);
  border: 1px solid #55a7ff45;
  border-radius: 22px;
  padding: 22px;
  margin-bottom: 15px;
  box-shadow: 0 12px 30px #0004;
}

.wallet-card h2 {
  font-size: 21px;
  margin: 12px 0;
}

.wallet-card p {
  color: #b7c9e8;
  font-size: 12px;
  line-height: 1.7;
}

.notice {
  color: #f2ca76;
  background: #f2c66d0d;
  border: 1px solid #f2c66d35;
  border-radius: 14px;
  padding: 14px;
  font-size: 11px;
  line-height: 1.6;
  margin-top: 15px;
}

.empty {
  text-align: center;
  padding: 35px 15px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.toast {
  position: fixed;
  bottom: 105px;
  left: 50%;
  transform: translateX(-50%);
  background: #152b49;
  border: 1px solid #398aff;
  color: white;
  padding: 13px 19px;
  border-radius: 14px;
  font-size: 12px;
  box-shadow: 0 8px 25px #0008;
  display: none;
  z-index: 30;
  white-space: nowrap;
}

@media (max-width: 360px) {
  .tap-button {
    width: 190px;
    height: 190px;
  }

  .balance {
    font-size: 36px;
  }

  .primary-btn {
    padding: 10px 11px;
  }
}
</style>
